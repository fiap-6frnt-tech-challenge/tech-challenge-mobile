name: CI
on:
  pull_request:
    branches: [phase-3, main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - name: Setup Java JRE (needed for Firebase emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx -p firebase-tools firebase emulators:exec --only firestore "npm run test:domain"
